<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#feda75"/>
      <stop offset=".3" stop-color="#fa7e1e"/>
      <stop offset=".6" stop-color="#d62976"/>
      <stop offset="1" stop-color="#4f5bd5"/>
    </linearGradient>
    <filter id="lift" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="#111111"/>
  <g fill="#ffffff">
    <rect x="52" y="52" width="44" height="44" rx="10" opacity=".95"/>
    <rect x="106" y="52" width="44" height="44" rx="10" opacity=".95"/>
    <rect x="52" y="106" width="44" height="44" rx="10" opacity=".95"/>
    <rect x="106" y="106" width="44" height="44" rx="10" opacity=".95"/>
    <rect x="160" y="106" width="44" height="44" rx="10" opacity=".95"/>
    <rect x="52" y="160" width="44" height="44" rx="10" opacity=".95"/>
    <rect x="106" y="160" width="44" height="44" rx="10" opacity=".95"/>
    <rect x="160" y="160" width="44" height="44" rx="10" opacity=".95"/>
  </g>
  <!-- Empty slot the lifted tile came from -->
  <rect x="161.5" y="53.5" width="41" height="41" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="3" stroke-dasharray="7 6"/>
  <!-- Tile being dragged into place -->
  <rect x="166" y="34" width="50" height="50" rx="12" fill="url(#ig)" transform="rotate(10 191 59)" filter="url(#lift)"/>
</svg>
